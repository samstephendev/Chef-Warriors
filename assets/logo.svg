<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" aria-label="The Chef Warriors logo">
  <circle cx="40" cy="40" r="40" fill="url(#logoGrad)"/>
  <!-- Chef hat -->
  <rect x="24" y="34" width="32" height="16" rx="3" fill="white"/>
  <ellipse cx="40" cy="34" rx="16" ry="10" fill="white"/>
  <ellipse cx="40" cy="26" rx="10" ry="14" fill="white"/>
  <!-- Hat band / details -->
  <rect x="24" y="42" width="32" height="3" rx="1" fill="#F2B84B"/>
  <!-- CW text below hat -->
  <text x="40" y="60" font-size="10" font-weight="800" fill="white" text-anchor="middle" font-family="sans-serif">CW</text>
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2B84B"/>
      <stop offset="100%" stop-color="#D9892B"/>
    </linearGradient>
  </defs>
</svg>
