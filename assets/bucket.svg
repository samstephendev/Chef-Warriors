<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none" aria-label="Chicken bucket">
  <!-- Bucket body -->
  <path d="M60 140 L80 360 Q160 380 240 360 L260 140 Z" fill="url(#bucketGrad)" rx="8"/>
  <!-- Bucket rim -->
  <ellipse cx="160" cy="140" rx="100" ry="22" fill="#E0352B"/>
  <!-- Bucket stripe -->
  <path d="M65 190 L255 190" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <path d="M70 240 L250 240" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Chicken pieces peeking out -->
  <ellipse cx="120" cy="110" rx="38" ry="30" fill="#F2B84B"/>
  <ellipse cx="195" cy="105" rx="34" ry="28" fill="#D9892B"/>
  <ellipse cx="155" cy="95" rx="40" ry="32" fill="#F2B84B"/>
  <!-- Highlight on bucket -->
  <path d="M80 160 Q90 150 95 200 Q85 210 80 160Z" fill="rgba(255,255,255,0.08)"/>
  <!-- Chef Warriors logo mark on bucket -->
  <circle cx="160" cy="270" r="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="160" y="276" font-size="14" font-weight="700" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="sans-serif">CW</text>
  <defs>
    <linearGradient id="bucketGrad" x1="60" y1="140" x2="260" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0352B"/>
      <stop offset="100%" stop-color="#8E1A14"/>
    </linearGradient>
  </defs>
</svg>
